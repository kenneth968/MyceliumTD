<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mycelium TD</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232b6f52'/%3E%3Cpath d='M14 33c0-12 8-21 18-21s18 9 18 21H14z' fill='%23f3e5ab'/%3E%3Cpath d='M27 33h10v19H27z' fill='%23f3e5ab'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameContainer {
            position: relative;
        }
        #gameCanvas {
            display: block;
            width: 1280px;
            height: 720px;
            background: #0f0f1a;
            outline: 2px solid #333;
            outline-offset: -2px;
            border-radius: 4px;
        }
        #gameCanvas:focus-visible {
            outline: 3px solid #4ade80;
            outline-offset: -3px;
        }
        #hotkeyBar {
            position: absolute;
            top: 8px;
            left: 310px;
            right: 232px;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 1;
            pointer-events: none;
            padding: 5px 8px;
            font-size: 12px;
            color: #c7d2de;
            background: rgba(8, 14, 20, 0.88);
            border: 1px solid #334455;
            border-radius: 4px;
        }
        #hotkeyBar kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720" role="application" aria-label="Mycelium TD game" aria-describedby="hotkeyBar" tabindex="0">
            Mycelium TD requires a browser with Canvas support.
        </canvas>
        <div id="hotkeyBar">
            <span><kbd>1</kbd>-<kbd>6</kbd> Towers</span>
            <span><kbd>Enter</kbd> Start Wave</span>
            <span><kbd>Space</kbd> Pause</span>
            <span><kbd>F1</kbd>-<kbd>F3</kbd> Speed</span>
            <span><kbd>Esc</kbd> Cancel</span>
            <span><kbd>N</kbd> Mute</span>
        </div>
    </div>
    <script src="bundle.js"></script>
</body>
</html>
